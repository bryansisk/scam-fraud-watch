{% assign canonical_url = page.url | absolute_url %}
{% assign page_description = page.description | default: site.description %}
<link rel="canonical" href="{{ canonical_url | escape }}">
<meta name="description" content="{{ page_description | escape }}">
<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page_description | escape }}">
<meta property="og:url" content="{{ canonical_url | escape }}">
<meta property="og:site_name" content="SCAM Watch">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ '/' | absolute_url }}#website",
      "name": "SCAM Watch",
      "url": "{{ '/' | absolute_url }}",
      "description": {{ site.description | jsonify }}
    },
    {
      "@type": "WebPage",
      "@id": {{ canonical_url | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "name": {{ page.title | default: site.title | jsonify }},
      "description": {{ page_description | jsonify }},
      "inLanguage": "en-US",
      "isPartOf": { "@id": "{{ '/' | absolute_url }}#website" }
    }
  ]
}
</script>
